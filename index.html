<style>
  /* Layout: jedna herní plocha přes celou výšku, tenký rámeček, ovládání v nápovědě pod ní. */
  :root {
    --bg: #0f1318;
    --panel: #171d24;
    --line: #28313b;
    --steel: #93a4b4;
    --fg: #e6ebf0;
    --copper: #e08a4c;
    --danger: #ea6a5e;
    --font-display: "Silkscreen", "Courier New", monospace;
    --font-body: "Barlow Semi Condensed", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #stage {
    flex: 1;
    min-height: 0;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    overflow: hidden;
    position: relative;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  canvas:focus-visible { outline: 2px solid var(--copper); outline-offset: -2px; }
  #help {
    margin: 0;
    font-size: 14px;
    color: var(--steel);
    text-align: center;
    letter-spacing: 0.02em;
  }
  #help kbd {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    background: var(--panel);
  }
</style>

    level = 1; total = 0; score = 0; combo = 0; collected = 0;
    timeLeft = levelTime(1);
    player = { x: W / 2, y: H / 2 + 20, vx: 0, vy: 0 };
    items = []; particles = []; popups = [];
    state = 'play';
    canvas.focus({ preventScroll: true });
  }

  function nextLevel() {
    level++; collected = 0;
    timeLeft = levelTime(level);
    items = [];
    levelupTimer = 1.6;
    state = 'levelup';
  }

  function spawnItem() {
    const m = 44;
    const life = levelLife(level);
    items.push({
      x: m + Math.random() * (W - 2 * m),
      y: CFG.hudTop + m / 2 + Math.random() * (H - CFG.hudTop - m * 1.5),
      life, maxLife: life, phase: Math.random() * 6.28
    });
  }

  function burst(x, y) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * 6.28, s = 80 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 });
    }
  }

  function endGame() {
    timeLeft = 0;
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem('zelezo-best', String(best)); } catch (e) {}
    }
  }

  function togglePause() {
    if (state === 'play') state = 'pause';
    else if (state === 'pause') state = 'play';
  }

  // ---------- Ovládání ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if ((e.code === 'Space' || e.code === 'Enter') && (state === 'menu' || state === 'over')) startGame();
    else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    else if ((e.code === 'Space') && state === 'pause') togglePause();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

  const pointer = { down: false, x: 0, y: 0 };
  function setPointer(e) {
    const r = canvas.getBoundingClientRect();
    pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top;
  }
  canvas.addEventListener('pointerdown', e => {
    setPointer(e);
    if (state === 'menu' || state === 'over') { startGame(); return; }
    if (state === 'pause') { state = 'play'; return; }
    pointer.down = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', setPointer);
  const release = () => { pointer.down = false; };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  // ---------- Logika ----------
  function update(dt) {
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);

    if (state === 'levelup') {
      levelupTimer -= dt;
      if (levelupTimer <= 0) state = 'play';
      return;
    }
    if (state !== 'play') return;

    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW) dy -= 1;
    if (keys.ArrowDown || keys.KeyS) dy += 1;
    if (pointer.down) {
      const tx = pointer.x - player.x, ty = pointer.y - player.y;
      const d = Math.hypot(tx, ty);
      if (d > 10) { dx = tx / d; dy = ty / d; }
    }
    const len = Math.hypot(dx, dy);
    if (len > 0) { dx /= len; dy /= len; }
    const sp = levelSpeed(level);
    const k = Math.min(1, dt * 12);
    player.vx += (dx * sp - player.vx) * k;
    player.vy += (dy * sp - player.vy) * k;
    if (Math.abs(player.vx) > 20) player.facing = player.vx < 0 ? -1 : 1;
    player.sx = (player.sx || 1) + ((player.facing || 1) - (player.sx || 1)) * Math.min(1, dt * 18);
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    const pd = playerDims();
    player.x = Math.max(pd.w / 2, Math.min(W - pd.w / 2, player.x));
    player.y = Math.max(pd.h / 2 + 4, Math.min(H - pd.h / 2 - 4, player.y));

    while (items.length < CFG.maxItems) spawnItem();
    for (const it of items) it.life -= dt;
    const before = items.length;
    items = items.filter(it => it.life > 0);
    if (items.length < before) combo = 0; // propadlý item přeruší sérii

    const hitR = CFG.itemSize / 2 + Math.min(pd.w, pd.h) / 2.4;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (Math.hypot(it.x - player.x, it.y - player.y) < hitR) {
        items.splice(i, 1);
        collected++; total++; combo++;
        const gain = 10 * Math.min(combo, 10) * level;
        score += gain;
        timeLeft += CFG.timeBonus;
        burst(it.x, it.y);
        popups.push({ x: it.x, y: it.y, text: '+' + gain, life: 0.8 });
      }
    }

    timeLeft -= dt;
    if (collected >= levelNeed(level)) { nextLevel(); return; }
    if (timeLeft <= 0) endGame();
  }

  // ---------- Kreslení ----------
  function drawBackground() {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    const g = 40;
    ctx.beginPath();
    for (let x = 0; x <= W; x += g) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = 0; y <= H; y += g) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
  }

  function drawItem(it, t) {
    const s = CFG.itemSize;
    const bob = Math.sin(t * 3 + it.phase) * 4;
    const blink = it.life < 1.5 ? (Math.sin(t * 22) > 0 ? 1 : 0.3) : 1;
    ctx.save();
    ctx.globalAlpha = blink;
    ctx.translate(it.x, it.y + bob);
    const grd = ctx.createRadialGradient(0, 0, 4, 0, 0, s * 0.9);
    grd.addColorStop(0, 'rgba(224,138,76,0.22)');
    grd.addColorStop(1, 'rgba(224,138,76,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.9, 0, 6.28); ctx.fill();
    ctx.imageSmoothingEnabled = false;
    if (ironImg.ready) {
      const r = ironImg.naturalWidth / ironImg.naturalHeight;
      ctx.drawImage(ironImg, -s * r / 2, -s / 2, s * r, s);
    } else {
      ctx.fillStyle = C.steel;
      ctx.fillRect(-s / 2, -s / 3, s, s * 0.66);
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(147,164,180,0.25)';
    ctx.fillRect(it.x - 16, it.y + s / 2 + 8, 32, 3);
    ctx.fillStyle = C.copper;
    ctx.fillRect(it.x - 16, it.y + s / 2 + 8, 32 * Math.max(0, it.life / it.maxLife), 3);
  }

  function drawPlayer() {
    const pd = playerDims();
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath(); ctx.ellipse(0, pd.h / 2, pd.w / 2.4, 7, 0, 0, 6.28); ctx.fill();
    ctx.rotate(Math.max(-0.25, Math.min(0.25, player.vx / 1500)));
    ctx.scale(player.sx || 1, 1);
    if (playerImg.ready) {
      ctx.drawImage(playerImg, -pd.w / 2, -pd.h / 2, pd.w, pd.h);
    } else {
      ctx.fillStyle = C.copper;
      ctx.beginPath(); ctx.arc(0, 0, pd.w / 2, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  }

  function drawHUD() {
    const pad = 16;
    ctx.textBaseline = 'middle';

    ctx.textAlign = 'left';
    ctx.fillStyle = C.fg;
    ctx.font = '700 17px ' + F_DISPLAY;
    ctx.fillText('LEVEL ' + level, pad, 24);

    ctx.textAlign = 'right';
    ctx.fillStyle = timeLeft < 6 ? C.danger : C.fg;
    ctx.fillText(timeLeft.toFixed(1) + ' s', W - pad, 24);

    // postup levelu
    const need = levelNeed(level);
    const bx = pad, bw = W - pad * 2, by = 44, bh = 12;
    ctx.fillStyle = 'rgba(147,164,180,0.16)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = C.copper;
    ctx.fillRect(bx, by, bw * Math.min(1, collected / need), bh);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.fg;
    ctx.font = '600 13px ' + F_BODY;
    ctx.fillText(collected + ' / ' + need + ' ks', W / 2, by + bh + 12);

    ctx.font = '600 14px ' + F_BODY;
    ctx.fillStyle = C.steel;
    ctx.textAlign = 'left';
    ctx.fillText('Rychlost ' + Math.round(levelSpeed(level)), pad, 78);
    ctx.textAlign = 'right';
    const comboTxt = combo > 1 ? '  |  série x' + Math.min(combo, 10) : '';
    ctx.fillText('Skóre ' + score + comboTxt + '  |  Rekord ' + best, W - pad, 78);
  }

  function overlay(lines) {
    ctx.fillStyle = C.dim;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const total = lines.reduce((s, l) => s + l[1] + 14, -14);
    let y = H / 2 - total / 2;
    for (const [txt, size, color, family] of lines) {
      y += size / 2;
      ctx.font = (family === 'd' ? '700 ' : '600 ') + size + 'px ' + (family === 'd' ? F_DISPLAY : F_BODY);
      ctx.fillStyle = color;
      ctx.fillText(txt, W / 2, y);
      y += size / 2 + 14;
    }
  }

  function draw(t) {
    drawBackground();
    if (state !== 'menu') {
      for (const it of items) drawItem(it, t);
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life * 2);
        ctx.fillStyle = C.copper;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
      if (player) drawPlayer();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 18px ' + F_DISPLAY;
      for (const p of popups) {
        ctx.globalAlpha = Math.max(0, p.life / 0.8);
        ctx.fillStyle = C.copper;
        ctx.fillText(p.text, p.x, p.y - 28);
      }
      ctx.globalAlpha = 1;
      drawHUD();
    }

    const big = Math.min(44, Math.max(26, W / 11));
    if (state === 'menu') {
      overlay([
        ['SBĚR ŽELEZA', big, C.fg, 'd'],
        ['Sbírej železo. Každý level je rychlejší a kratší.', 18, C.steel],
        ['Série bez propadlého kusu zvyšují skóre.', 16, C.steel],
        ['Klepni nebo stiskni mezerník', 20, C.copper]
      ]);
    } else if (state === 'levelup') {
      overlay([
        ['LEVEL ' + level, big, C.copper, 'd'],
        ['Rychlost ' + Math.round(levelSpeed(level)) + '  |  cíl ' + levelNeed(level) + ' ks  |  ' + levelTime(level).toFixed(0) + ' s', 18, C.fg]
      ]);
    } else if (state === 'pause') {
      overlay([
        ['PAUZA', big, C.fg, 'd'],
        ['Klepni nebo stiskni P', 18, C.copper]
      ]);
    } else if (state === 'over') {
      overlay([
        ['KONEC HRY', big, C.danger, 'd'],
        ['Level ' + level + '  |  sebráno ' + total + ' ks', 20, C.fg],
        ['Skóre ' + score + '  |  rekord ' + best, 18, C.steel],
        ['Klepni nebo stiskni mezerník', 20, C.copper]
      ]);
    }
  }

  // ---------- Smyčka ----------
  resize();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 17px Silkscreen');
    document.fonts.load('600 14px "Barlow Semi Condensed"');
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
